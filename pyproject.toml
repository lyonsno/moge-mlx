[project]
name = "moge-mlx"
version = "0.1.0"
description = "MLX-native MoGe-2 monocular geometry estimation components for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "huggingface-hub",
    "mlx>=0.30",
    "numpy",
    "pillow",
    "safetensors",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
pytorch-reference = [
    "torch",
    "moge @ git+https://github.com/microsoft/MoGe.git",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moge_mlx*"]
